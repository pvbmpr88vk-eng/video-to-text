# Local Telegram Bot API (TZ-09). Files >20 MB; requires TELEGRAM_API_ID + TELEGRAM_API_HASH.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.local-bot-api.yml --profile with-local-bot-api up -d

services:
  telegram-bot-api:
    profiles: [with-local-bot-api]
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID from my.telegram.org}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH}
      # Обязательно: без TELEGRAM_LOCAL лимит getFile остаётся 20 MB (не 500 MB).
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    healthcheck:
      # Root returns 404 when API is up — spider-only check would mark unhealthy.
      test:
        [
          "CMD-SHELL",
          "wget -q --server-response http://127.0.0.1:8081/ 2>&1 | grep -q 'HTTP/'",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 512M

  telegram-bot-api-cleanup:
    profiles: [with-local-bot-api]
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      telegram-bot-api:
        condition: service_started
    volumes:
      - telegram_bot_api_data:/data
    environment:
      TG_API_CACHE_TTL_HOURS: ${TELEGRAM_BOT_API_CACHE_TTL_HOURS:-6}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ttl="$${TG_API_CACHE_TTL_HOURS:-6}"
        echo "telegram-bot-api cleanup: removing files older than $${ttl}h under /data"
        while true; do
          find /data -type f -mmin +$$(( ttl * 60 )) -delete 2>/dev/null || true
          find /data -type d -empty -not -path /data -delete 2>/dev/null || true
          sleep 3600
        done
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "1"
    deploy:
      resources:
        limits:
          memory: 64M

  bot:
    environment:
      TELEGRAM_BOT_API_BASE_URL: http://telegram-bot-api:8081
      TELEGRAM_BOT_FILE_SIZE_LIMIT: ${TELEGRAM_BOT_FILE_SIZE_LIMIT:-524288000}
    # Local API stores files here; bot copies by path (see app/telegram/download.py).
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api:ro
    group_add:
      - "101"
    depends_on:
      redis:
        condition: service_healthy
      telegram-bot-api:
        condition: service_healthy

volumes:
  telegram_bot_api_data:
