[project]
name = "video-to-text"
version = "0.1.0"
description = "Extract audio from video and transcribe to text"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require ffmpeg installed",
]
