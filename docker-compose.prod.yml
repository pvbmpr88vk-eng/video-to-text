# Production overrides for 2 vCPU / 4 GB VPS (TZ-08)

services:
  redis:
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 256M

  bot:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  worker-transcript:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      GPU_SHARING_STT_STAGING_DIR: ${GPU_SHARING_STT_STAGING_DIR:-/staging/gpu-audio}
    deploy:
      resources:
        limits:
          memory: 2800M

  worker-summary:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
